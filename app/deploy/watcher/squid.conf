# Watcher proxy. Two jobs:
#  3128: allowlist-only forward proxy for changedetection's page fetches.
#  3129: reverse proxy so the host (relay, Craig's tunnel) can reach the
#        changedetection UI/API, which sits on an internal-only network.
http_port 3128
http_port 3129 accel defaultsite=changedetection
cache_peer changedetection parent 5000 0 no-query originserver name=cd

acl accelport myportname 3129
acl allowed dstdomain "/etc/squid/allowed-hosts.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

cache_peer_access cd allow accelport
cache_peer_access cd deny all

http_access allow accelport
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all

cache deny all
access_log stdio:/dev/stdout
via off
forwarded_for delete
